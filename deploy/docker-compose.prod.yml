# ==============================================================================
# STACK DE PRODUCCIÓN DOCKER COMPOSE - HUAGURUNCHO 360
# Dominio: apih.aquienpasco.com
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: huaguruncho_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-huaguruncho_db}
      POSTGRES_USER: ${DB_USER:-huaguruncho_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-huaguruncho_secure_pass_2026}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-huaguruncho_user} -d ${DB_NAME:-huaguruncho_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: huaguruncho_prod_backend
    restart: always
    expose:
      - "8000"
    volumes:
      - static_prod_data:/app/staticfiles
      - media_prod_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-apih.aquienpasco.com,.aquienpasco.com,localhost,127.0.0.1,backend}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://apih.aquienpasco.com,https://aquienpasco.com,https://*.aquienpasco.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://apih.aquienpasco.com,https://aquienpasco.com,https://www.aquienpasco.com}
      - DB_NAME=${DB_NAME:-huaguruncho_db}
      - DB_USER=${DB_USER:-huaguruncho_user}
      - DB_PASSWORD=${DB_PASSWORD:-huaguruncho_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgres://${DB_USER:-huaguruncho_user}:${DB_PASSWORD:-huaguruncho_secure_pass_2026}@db:5432/${DB_NAME:-huaguruncho_db}
      - SECURE_SSL_REDIRECT=True
      - SERVE_MEDIA=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      db:
        condition: service_healthy
      rust_engine:
        condition: service_started

  rust_engine:
    build:
      context: ../rust
      dockerfile: Dockerfile
    container_name: huaguruncho_prod_rust
    restart: always
    expose:
      - "8081"
    volumes:
      - media_prod_data:/app/media
    environment:
      - RUST_ENGINE_PORT=8081

  nginx:
    image: nginx:alpine
    container_name: huaguruncho_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod_data:/app/staticfiles:ro
      - media_prod_data:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: huaguruncho_prod_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  postgres_prod_data:
  static_prod_data:
  media_prod_data:
  certbot_conf:
  certbot_www:
