services:
  db:
    image: postgres:16-alpine
    container_name: huaguruncho_postgres
    environment:
      - POSTGRES_DB=huaguruncho_db
      - POSTGRES_USER=huaguruncho_user
      - POSTGRES_PASSWORD=huaguruncho_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huaguruncho_user -d huaguruncho_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huaguruncho_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - ALLOWED_HOSTS=apih.aquienpasco.com,.aquienpasco.com,localhost,127.0.0.1,10.0.2.2,0.0.0.0,backend
      - CSRF_TRUSTED_ORIGINS=https://apih.aquienpasco.com,https://aquienpasco.com,https://*.aquienpasco.com,http://localhost:8000,http://127.0.0.1:8000
      - CORS_ALLOWED_ORIGINS=https://apih.aquienpasco.com,https://aquienpasco.com,https://www.aquienpasco.com,http://localhost:3000,http://127.0.0.1:3000
      - DB_NAME=huaguruncho_db
      - DB_USER=huaguruncho_user
      - DB_PASSWORD=huaguruncho_secure_pass_2026
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgres://huaguruncho_user:huaguruncho_secure_pass_2026@db:5432/huaguruncho_db
      - SECURE_SSL_REDIRECT=False
      - SERVE_MEDIA=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      rust_engine:
        condition: service_started
    restart: unless-stopped

  rust_engine:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: huaguruncho_rust_engine
    ports:
      - "8081:8081"
    volumes:
      - media_data:/app/media
    environment:
      - RUST_ENGINE_PORT=8081
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:


