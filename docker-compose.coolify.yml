# ==============================================================================
# CONFIGURACIÓN DOCKER COMPOSE OPTIMIZADA PARA COOLIFY
# Proyecto: HUAGURUNCHO 360
# Dominio de Producción: apih.aquienpasco.com
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huaguruncho_backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-coolify-replace-in-env-key-huaguruncho-2026!}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-apih.aquienpasco.com,.aquienpasco.com,localhost,127.0.0.1,backend}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://apih.aquienpasco.com,https://aquienpasco.com,https://*.aquienpasco.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://apih.aquienpasco.com,https://aquienpasco.com,https://www.aquienpasco.com}
      - DB_NAME=${POSTGRES_DB:-huaguruncho_db}
      - DB_USER=${POSTGRES_USER:-huaguruncho_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-huaguruncho_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-huaguruncho_user}:${POSTGRES_PASSWORD:-huaguruncho_secure_pass_2026}@db:5432/${POSTGRES_DB:-huaguruncho_db}
      - SECURE_SSL_REDIRECT=False
      - SERVE_MEDIA=True
      - AUTO_SEED=${AUTO_SEED:-True}
      - DATA_UPLOAD_MAX_MEMORY_SIZE=52428800
      - FILE_UPLOAD_MAX_MEMORY_SIZE=52428800
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      rust_engine:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: huaguruncho_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-huaguruncho_db}
      - POSTGRES_USER=${POSTGRES_USER:-huaguruncho_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-huaguruncho_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huaguruncho_user} -d ${POSTGRES_DB:-huaguruncho_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rust_engine:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: huaguruncho_rust_engine
    restart: unless-stopped
    expose:
      - "8081"
    volumes:
      - media_data:/app/media
    environment:
      - RUST_ENGINE_PORT=8081

volumes:
  postgres_data:
  media_data:
