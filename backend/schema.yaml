openapi: 3.0.3
info:
  title: HUAGURUNCHO 360 API
  version: 1.0.0
  description: API REST para turismo sostenible, tour virtual 360 y eco-reportes ambientales
    en el Nevado Huaguruncho (Huachón, Pasco, Perú).
paths:
  /api/v1/admin/environmental-reports/:
    get:
      operationId: admin_environmental_reports_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          title: Categoría del Incidente
          enum:
          - accidente
          - basura
          - flora_fauna_afectada
          - incendio
          - otro
          - senalizacion_danada
        description: |-
          * `basura` - Acumulación de Basura / Residuos
          * `incendio` - Foco de Incendio / Quema
          * `accidente` - Accidente o Persona en Riesgo
          * `senalizacion_danada` - Señalización Turística Dañada
          * `flora_fauna_afectada` - Flora o Fauna Afectada
          * `otro` - Otro Incidente Ambiental
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: route__uuid
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Estado del Reporte
          enum:
          - atendido
          - cerrado
          - en_revision
          - pendiente
          - recibido
        description: |-
          * `pendiente` - Pendiente de Revisión
          * `recibido` - Recibido por Central
          * `en_revision` - En Inspección / Verificación
          * `atendido` - Atendido / Solucionado
          * `cerrado` - Cerrado
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnvironmentalReportList'
          description: ''
  /api/v1/admin/environmental-reports/{uuid}/:
    get:
      operationId: admin_environmental_reports_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentalReport'
          description: ''
    patch:
      operationId: admin_environmental_reports_partial_update
      summary: Actualizar estado de reporte (Administración)
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminReportStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminReportStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminReportStatusRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentalReport'
          description: ''
  /api/v1/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      summary: Obtener métricas globales de turismo, conservación y comunidad
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
          description: ''
  /api/v1/audio-guides/:
    get:
      operationId: audio_guides_list
      summary: Listar audioguías y relatos culturales bilingües
      parameters:
      - in: query
        name: category
        schema:
          type: string
          title: Categoría Temática
          enum:
          - flora_fauna
          - hidrologia
          - historia
          - mitologia
        description: |-
          * `mitologia` - Mitología Andina y Cosmovisión
          * `hidrologia` - Hidrología Sagrada y Lagunas
          * `flora_fauna` - Flora y Fauna Milenaria
          * `historia` - Historia Comunal y Tradiciones
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - audio-guides
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudioGuide'
          description: ''
  /api/v1/audio-guides/{uuid}/:
    get:
      operationId: audio_guides_retrieve
      summary: Obtener detalle de audioguía con transcripciones en Español y Quechua
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - audio-guides
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioGuide'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Autentica al usuario con correo y contraseña, retornando tokens
        JWT.
      summary: Inicio de sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_profile_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Crea una nueva cuenta de usuario turista y retorna tokens JWT.
      summary: Registro de nuevo turista
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/badges/:
    get:
      operationId: badges_list
      summary: Listar medallas y logros ecológicos de Guardián Glacial
      parameters:
      - in: query
        name: tier
        schema:
          type: string
          title: Nivel
          enum:
          - bronce
          - diamante
          - oro
          - plata
        description: |-
          * `bronce` - Bronce
          * `plata` - Plata
          * `oro` - Oro
          * `diamante` - Diamante Glacial
      tags:
      - badges
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuardianBadge'
          description: ''
  /api/v1/badges/{slug}/:
    get:
      operationId: badges_retrieve
      summary: Obtener detalle de medalla
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - badges
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianBadge'
          description: ''
  /api/v1/biodiversity/:
    get:
      operationId: biodiversity_list
      summary: Listar catálogo de biodiversidad altoandina
      parameters:
      - in: query
        name: category
        schema:
          type: string
          title: Categoría
          enum:
          - aves
          - endemicas
          - fauna
          - flora
        description: |-
          * `flora` - Flora Nativa
          * `fauna` - Fauna Silvestre
          * `aves` - Aves de Altura
          * `endemicas` - Especies Endémicas
      - in: query
        name: conservation_status
        schema:
          type: string
          title: Estado de Conservación (UICN / SERFOR)
          enum:
          - CR
          - EN
          - LC
          - NT
          - VU
        description: |-
          * `CR` - En Peligro Crítico (CR)
          * `EN` - En Peligro (EN)
          * `VU` - Vulnerable (VU)
          * `NT` - Casi Amenazado (NT)
          * `LC` - Preocupación Menor (LC)
      - in: query
        name: is_endemic
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - biodiversity
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BiodiversitySpecies'
          description: ''
  /api/v1/biodiversity/{uuid}/:
    get:
      operationId: biodiversity_retrieve
      summary: Obtener detalle de una especie de flora o fauna
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - biodiversity
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiodiversitySpecies'
          description: ''
  /api/v1/checkpoint-entries/:
    get:
      operationId: checkpoint_entries_list
      description: |-
        Control de acceso y retorno obligatorio de residuos sólidos en el Nevado Huaguruncho.
        Restringido exclusivamente a Guardaparques, Personal Municipal y Administradores.
      summary: Listar registros del puesto de control (Guardaparques)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Estado de la Visita
          enum:
          - alerta_retraso
          - completado
          - en_montana
        description: |-
          * `en_montana` - En Montaña / Ascendiendo
          * `completado` - Descenso Completado / Verificado
          * `alerta_retraso` - Alerta de Retraso
      - in: query
        name: waste_compliance_status
        schema:
          type: string
          title: Cumplimiento de Residuos (Huella Cero)
          enum:
          - compliant
          - extra_collected
          - infraction_missing
          - pending_checkout
        description: |-
          * `pending_checkout` - En Montaña (Pendiente de Retorno)
          * `compliant` - Conforme (Retornó 100% de Residuos)
          * `extra_collected` - Meritorio (Recogió Residuos Extras en Sendero)
          * `infraction_missing` - Infracción (Faltan Residuos / Abandono)
      tags:
      - checkpoint-entries
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckpointVisitorLogList'
          description: ''
    post:
      operationId: checkpoint_entries_create
      description: |-
        Control de acceso y retorno obligatorio de residuos sólidos en el Nevado Huaguruncho.
        Restringido exclusivamente a Guardaparques, Personal Municipal y Administradores.
      summary: Registrar entrada de visitante y declaración de residuos
      tags:
      - checkpoint-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointVisitorLog'
          description: ''
  /api/v1/checkpoint-entries/{uuid}/:
    get:
      operationId: checkpoint_entries_retrieve
      description: |-
        Control de acceso y retorno obligatorio de residuos sólidos en el Nevado Huaguruncho.
        Restringido exclusivamente a Guardaparques, Personal Municipal y Administradores.
      summary: Detalle de registro de puesto de control
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - checkpoint-entries
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointVisitorLog'
          description: ''
    put:
      operationId: checkpoint_entries_update
      description: |-
        Control de acceso y retorno obligatorio de residuos sólidos en el Nevado Huaguruncho.
        Restringido exclusivamente a Guardaparques, Personal Municipal y Administradores.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - checkpoint-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointVisitorLog'
          description: ''
    patch:
      operationId: checkpoint_entries_partial_update
      description: |-
        Control de acceso y retorno obligatorio de residuos sólidos en el Nevado Huaguruncho.
        Restringido exclusivamente a Guardaparques, Personal Municipal y Administradores.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - checkpoint-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCheckpointVisitorLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCheckpointVisitorLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCheckpointVisitorLogRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointVisitorLog'
          description: ''
    delete:
      operationId: checkpoint_entries_destroy
      description: |-
        Control de acceso y retorno obligatorio de residuos sólidos en el Nevado Huaguruncho.
        Restringido exclusivamente a Guardaparques, Personal Municipal y Administradores.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - checkpoint-entries
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/checkpoint-entries/{uuid}/check-out/:
    post:
      operationId: checkpoint_entries_check_out_create
      description: Verifica los residuos devueltos por el visitante y actualiza el
        estado de cumplimiento.
      summary: Registrar salida de visitante e inspección de residuos (Check-out)
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - checkpoint-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckpointVisitorLogRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointVisitorLog'
          description: ''
  /api/v1/checkpoint-entries/sync-batch/:
    post:
      operationId: checkpoint_entries_sync_batch_create
      description: |-
        Endpoint de sincronización en lote offline para la garita de guardaparques.
        Idempotente respecto a local_uuid.
      summary: Sincronización en lote offline de registros de guardabosques
      tags:
      - checkpoint-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointSyncBatchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckpointSyncBatchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckpointSyncBatchRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointSyncBatchResponse'
          description: ''
  /api/v1/community-posts/:
    get:
      operationId: community_posts_list
      summary: Listar publicaciones aprobadas del muro comunitario
      parameters:
      - in: query
        name: category
        schema:
          type: string
          title: Categoría
          enum:
          - accion_ecologica
          - avistamientos
          - consejos
          - fotografia
        description: |-
          * `fotografia` - Fotografía de Alta Montaña
          * `avistamientos` - Avistamientos de Flora y Fauna
          * `consejos` - Consejos de Ruta y Seguridad
          * `accion_ecologica` - Acción Ecológica y Limpieza
      - in: query
        name: lnt_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - community-posts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommunityPostList'
          description: ''
    post:
      operationId: community_posts_create
      summary: Crear nueva publicación en el muro comunitario (pasa a moderación)
      tags:
      - community-posts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityPostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommunityPostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommunityPostRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPost'
          description: ''
  /api/v1/community-posts/{uuid}/:
    get:
      operationId: community_posts_retrieve
      summary: Obtener detalle de publicación comunitaria
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
