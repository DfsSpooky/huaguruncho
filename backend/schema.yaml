  /api/v1/weather-alerts/{uuid}/:
    get:
      operationId: weather_alerts_retrieve
      summary: Obtener detalle de una alerta meteorológica
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - weather-alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherAlert'
          description: ''
  /api/v1/weather-stations/:
    get:
      operationId: weather_stations_list
      summary: Listar estaciones meteorológicas por piso altitudinal
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - in: query
        name: risk_level
        schema:
          type: string
          title: Nivel de Riesgo
          enum:
          - bajo
          - extremo
          - heladas
          - moderado
          - ventisca
        description: |-
          * `bajo` - Bajo
          * `moderado` - Moderado
          * `heladas` - Heladas Nocturnas
          * `extremo` - Alto Riesgo / Extremo Albedo
          * `ventisca` - Ventisca y Congelamiento
      tags:
      - weather-stations
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MountainWeatherStation'
          description: ''
  /api/v1/weather-stations/{uuid}/:
    get:
      operationId: weather_stations_retrieve
      summary: Obtener clima detallado de una estación/sector
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          title: Identificador único público (UUID)
        required: true
      tags:
      - weather-stations
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MountainWeatherStation'
          description: ''
  /api/v1/weather-stations/refresh/:
    get:
      operationId: weather_stations_refresh_retrieve
      description: Forzar actualización en tiempo real desde la API meteorológica
      tags:
      - weather-stations
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MountainWeatherStation'
          description: ''
    post:
      operationId: weather_stations_refresh_create
      description: Forzar actualización en tiempo real desde la API meteorológica
      tags:
      - weather-stations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MountainWeatherStationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MountainWeatherStationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MountainWeatherStationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MountainWeatherStation'
          description: ''
