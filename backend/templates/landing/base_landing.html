{% load static %}
<!DOCTYPE html>
<html lang="es" class="scroll-smooth bg-[#F8F9FD] text-[#191C1F] antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Huaguruncho 360 — La App Oficial para Explorar el Nevado Huaguruncho (Pasco, Perú){% endblock %}</title>
    
    <!-- Metadatos SEO Principales -->
    <meta name="description" content="Descarga la aplicación oficial Huaguruncho 360: mapas 100% sin internet, fotos y tours en 360°, rutas seguras de caminata y cuidado ambiental en el Nevado Huaguruncho (5,742 m en Pasco, Perú). Proyecto impulsado por la Oficina de Investigación de la UNDAC.">
    <meta name="keywords" content="Huaguruncho 360, App Nevado Huaguruncho, Nevado Huaguruncho, Turismo Pasco, Huachón, Cordillera de Huaguruncho, Mapa de montaña sin internet, Tours 360 Perú, Trekking Huaguruncho, Lagunas de Pasco, Huella Cero, UNDAC Pasco">
    <meta name="author" content="Huaguruncho 360 & Oficina de Investigación de la Universidad Nacional Daniel Alcides Carrión (UNDAC)">
    <link rel="canonical" href="https://huaguruncho.aquienpasco.com/">
    <link rel="alternate" hreflang="es" href="https://huaguruncho.aquienpasco.com/">
    <link rel="alternate" hreflang="x-default" href="https://huaguruncho.aquienpasco.com/">

    <!-- Directivas de Indexación para Buscadores (Google, Bing, Yahoo) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

    <!-- SEO Local y Georreferenciación (Pasco, Perú) -->
    <meta name="geo.region" content="PE-PAS">
    <meta name="geo.placename" content="Huachón, Pasco, Perú">
    <meta name="geo.position" content="-10.5311;-75.9239">
    <meta name="ICBM" content="-10.5311, -75.9239">

    <!-- Configuración para Móviles y PWA -->
    <meta name="theme-color" content="#14171A">
    <meta name="msapplication-TileColor" content="#14171A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Huaguruncho 360">
    <meta name="application-name" content="Huaguruncho 360">
    <meta name="format-detection" content="telephone=no">

    <!-- Favicon e Icono de Aplicación SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314171A'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif' font-weight='900' font-size='38'>H</text><circle cx='76' cy='32' r='8' fill='%23A43716'/></svg>">
    <link rel="apple-touch-icon" href="https://huaguruncho.aquienpasco.com{% static 'images/huaguruncho_hero.jpg' %}">

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Telegram, Discord, iMessage) -->
    <meta property="og:locale" content="es_PE">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Huaguruncho 360">
    <meta property="og:title" content="Huaguruncho 360 — La App Oficial para Explorar el Nevado Huaguruncho">
    <meta property="og:description" content="Descarga gratis la app móvil para descubrir el Nevado Huaguruncho (Pasco, Perú): mapas sin internet, fotos y vistas 360°, rutas paso a paso y turismo responsable. Proyecto impulsado por la Oficina de Investigación UNDAC.">
    <meta property="og:url" content="https://huaguruncho.aquienpasco.com/">
    <meta property="og:image" content="https://huaguruncho.aquienpasco.com{% static 'images/huaguruncho_hero.jpg' %}">
    <meta property="og:image:secure_url" content="https://huaguruncho.aquienpasco.com{% static 'images/huaguruncho_hero.jpg' %}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Nevado Huaguruncho (5,742 m) en Huachón, Pasco, Perú">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Huaguruncho 360 — La App Oficial para Explorar el Nevado Huaguruncho">
    <meta name="twitter:description" content="Mapas sin internet, tours virtuales en 360° y rutas hacia lagunas turquesas en el Coloso de Pasco. Descarga gratis para Android e iOS.">
    <meta name="twitter:image" content="https://huaguruncho.aquienpasco.com{% static 'images/huaguruncho_hero.jpg' %}">
    <meta name="twitter:image:alt" content="Nevado Huaguruncho 5,742 m en Pasco Perú">

    <!-- Tipografía Editorial de Campo: Outfit, Plus Jakarta Sans, JetBrains Mono & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (v3 CDN) con Paleta Calibrada Cordillera Field Instrument -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        basalt: {
                            900: '#14171A',
                            800: '#191C1F',
                            700: '#2E3134',
                            600: '#41484A',
                            500: '#575D5F',
                            400: '#6E767D',
                            300: '#BCC2BD',
                            200: '#DCE0DC',
                            100: '#ECEEF2',
                            50: '#F8F9FD',
                        },
                        ochre: {
                            DEFAULT: '#A43716',
                            hover: '#C54F2C',
                            dark: '#862201',
                            light: '#FFDBD1',
                        },
                        yareta: {
                            DEFAULT: '#2A5C43',
                            hover: '#36684E',
                            container: '#B6ECCB',
                            dark: '#1D5038',
                        },
                        glacial: {
                            DEFAULT: '#EDF3F5',
                            border: '#D2DFE3',
                            ice: '#E0F2F5',
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        };
    </script>
    
    <!-- HTMX 1.9.12 -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <!-- Alpine.js 3.x -->
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            vertical-align: middle;
        }

        /* Rejilla técnica milimétrica tipo carta geográfica */
        .carto-grid {
            background-image: 
                linear-gradient(to right, rgba(20, 23, 26, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(20, 23, 26, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Ocultar barra de scroll para listas horizontales en móviles */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Barra de desplazamiento austera y técnica */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #F0F2EE;
        }
        ::-webkit-scrollbar-thumb {
            background: #BCC2BD;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8B948E;
        }

        /* HTMX Indicator */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-flex;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-[#F8F9FD] text-[#191C1F] font-body antialiased selection:bg-ochre selection:text-white relative min-h-screen flex flex-col">

    <!-- Contenido Principal -->
    <div class="relative z-10 flex-grow">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
