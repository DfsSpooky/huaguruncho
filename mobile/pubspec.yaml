name: huaguruncho_360
description: "HUAGURUNCHO 360 - Explora, cuida y recorre el Nevado Huaguruncho (Huachón, Pasco, Perú)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # HTTP Client & Downloads
  dio: ^5.7.0

  # Local Persistence (Drift SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Location & GPS
  geolocator: ^12.0.0

  # Camera & Gallery
  image_picker: ^1.1.2

  # Network Connectivity
  connectivity_plus: ^6.0.5

  # UUID Generator
  uuid: ^4.5.1

  # Web & 360 Viewport
  webview_flutter: ^4.9.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  archive: ^3.6.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  ffigen: ^23.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/panoramas/
    - assets/web/
    - assets/mock_data/
